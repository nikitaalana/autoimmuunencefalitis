<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="autoimmuumencefalitis.nl komt binnenkort online.">
  <title>autoimmuumencefalitis.nl | Binnenkort online</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --muted: #5d7181;
      --paper: #f4f8fa;
      --panel: rgba(255, 255, 255, 0.86);
      --teal: #168b8b;
      --blue: #d9eaf4;
      --line: rgba(23, 50, 77, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
      isolation: isolate;
    }

    .page::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      opacity: 0.55;
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 4rem 4rem;
      mask-image: linear-gradient(to bottom right, black, transparent 65%);
    }

    main {
      width: min(100%, 48rem);
      padding: clamp(2.25rem, 6vw, 5rem) clamp(1.5rem, 7vw, 6rem);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: var(--panel);
      box-shadow: 0 1.5rem 4rem rgba(23, 50, 77, 0.08);
      text-align: center;
      animation: appear 700ms ease-out both;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      margin-bottom: 2.25rem;
      border: 1px solid var(--teal);
      border-radius: 50%;
      color: var(--teal);
      background: var(--blue);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--teal);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 14ch;
      margin: 0 auto 1.25rem;
      font-size: clamp(2.8rem, 8vw, 5.7rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.98;
    }

    .message {
      max-width: 28rem;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin: 2.5rem 0 0;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status::before {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 0.3rem rgba(22, 139, 139, 0.16);
      content: "";
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { overflow: auto; }
      .page { min-height: 100svh; padding: 1.25rem; }
      .page::before { background-size: 3rem 3rem; }
      main { padding: 2.5rem 1rem; }
      .mark { margin-bottom: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="mark" aria-hidden="true">ae</div>
      <p class="eyebrow">Een nieuwe website</p>
      <h1>Komt binnenkort.</h1>
      <p class="message">autoimmuumencefalitis.nl wordt op dit moment met zorg voorbereid. We zijn binnenkort online.</p>
      <p class="status">Binnenkort online</p>
    </main>
  </div>
</body>
</html>
